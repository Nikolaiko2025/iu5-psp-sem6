<!DOCTYPE html>
<html lang="ru">
<head>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Просмотр | GLB Models</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: var(--bg-primary);
    }
    
    .viewer-page {
      padding: 0;
    }
    
    .viewer-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: rgba(15, 15, 26, 0.9);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      text-decoration: none;
      font-weight: 500;
      padding: 10px 20px;
      border-radius: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      transition: all 0.3s ease;
    }
    
    .back-link:hover {
      background: var(--accent);
      border-color: var(--accent);
    }
    
    .back-link svg {
      width: 18px;
      height: 18px;
    }
    
    #model-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    
    .viewer-canvas-wrap {
      position: fixed;
      top: 70px;
      left: 0;
      right: 0;
      bottom: 80px;
    }
    
    #viewer-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: linear-gradient(145deg, #1a1a2e 0%, #0f0f1a 100%);
    }
    
    .viewer-controls {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      background: rgba(15, 15, 26, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }
    
    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 48px;
      height: 48px;
      padding: 0 20px;
      border-radius: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .ctrl-btn:hover {
      background: var(--accent);
      border-color: var(--accent);
      transform: translateY(-2px);
    }
    
    .ctrl-btn.active {
      background: var(--accent);
      border-color: var(--accent);
    }
    
    .ctrl-btn.zoom {
      font-size: 1.4rem;
      font-weight: 700;
    }
    
    .hint {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.7);
      color: var(--text-secondary);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.9rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .hint.show {
      opacity: 1;
    }
    
    @media (max-width: 600px) {
      .viewer-header {
        padding: 12px 16px;
      }
      
      .back-link {
        padding: 8px 14px;
        font-size: 0.9rem;
      }
      
      #model-title {
        font-size: 1rem;
      }
      
      .viewer-canvas-wrap {
        top: 60px;
      }
      
      .viewer-controls {
        gap: 8px;
        padding: 12px;
      }
      
      .ctrl-btn {
        min-width: 40px;
        height: 40px;
        padding: 0 14px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body class="viewer-page">
  <div class="viewer-header">
    <a class="back-link" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15,18 9,12 15,6"/>
      </svg>
      Назад
    </a>
    <div id="model-title"></div>
    <div style="width: 100px;"></div>
  </div>
  
  <div class="viewer-canvas-wrap">
    <canvas id="viewer-canvas"></canvas>
  </div>
  
  <div class="hint" id="hint">Используйте мышь для вращения</div>
  
  <div class="viewer-controls">
    <button class="ctrl-btn zoom" id="zoom-in" title="Приблизить">+</button>
    <button class="ctrl-btn zoom" id="zoom-out" title="Отдалить">−</button>
    <button class="ctrl-btn" id="view-top">Сверху</button>
    <button class="ctrl-btn" id="view-front">Спереди</button>
    <button class="ctrl-btn" id="view-back">Сзади</button>
    <button class="ctrl-btn" id="view-left">Слева</button>
    <button class="ctrl-btn" id="view-right">Справа</button>
    <button class="ctrl-btn" id="view-reset">Сброс</button>
  </div>
  
  <script src="idb.js"></script>
  <script type="module" src="detail.js"></script>
</body>
</html>
