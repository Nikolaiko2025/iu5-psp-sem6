<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="container">
      <a class="logo" href="index.html">
        <img class="logo-img" src="image/nikol1.png" alt="Николь">
      </a>
      
      <nav class="menu">
        <ul class="menu-list">
          <li><a href="calculator.html" class="menu-link">Калькулятор</a></li>
          <li><a href="film.html" class="menu-link">Фильмы</a></li>
          <li><a href="#" class="menu-link">Сериалы</a></li>
          <li><a href="#" class="menu-link">Детям</a></li>
          <li><a href="#" class="menu-link">ТВ</a></li>
          <li><a href="#" class="menu-link">Шоу</a></li>
          <li><a href="#" class="menu-link">Спорт</a></li>
          <li><a href="aboutme.html" class="menu-link">Обо мне</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="center-container">
    <div class="calculator">
      <div id="result" class="result">0</div>
      <div class="buttons">
        <div class="row">
          <button class="my-btn secondary" id="btn_op_clear">C</button>
          <button class="my-btn secondary" id="btn_op_sign">+/-</button>
          <button class="my-btn secondary" id="btn_op_percent">%</button>
          <button class="my-btn primary" id="btn_op_div">÷</button>
        </div>
        <div class="row">
          <button class="my-btn" id="btn_digit_7">7</button>
          <button class="my-btn" id="btn_digit_8">8</button>
          <button class="my-btn" id="btn_digit_9">9</button>
          <button class="my-btn primary" id="btn_op_mult">×</button>
        </div>
        <div class="row">
          <button class="my-btn" id="btn_digit_4">4</button>
          <button class="my-btn" id="btn_digit_5">5</button>
          <button class="my-btn" id="btn_digit_6">6</button>
          <button class="my-btn primary" id="btn_op_minus">−</button>
        </div>
        <div class="row">
          <button class="my-btn" id="btn_digit_1">1</button>
          <button class="my-btn" id="btn_digit_2">2</button>
          <button class="my-btn" id="btn_digit_3">3</button>
          <button class="my-btn primary" id="btn_op_plus">+</button>
        </div>
        <div class="row">
          <button class="my-btn" id="btn_digit_0">0</button>
          <button class="my-btn" id="btn_digit_dot">,</button>
          <button class="my-btn primary execute" id="btn_op_equal">=</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let текущееЧисло = '0';
    let выбранныйОператор = null;
    let предыдущееЧисло = null;
    let сброситьПослеРавно = false;
    let выражение = [];
    
    let экран = document.getElementById('result');
    
    function ограничитьЦифры(число) {
      let строка = число.toPrecision(13);
      строка = parseFloat(строка).toString();
      if (строка.length > 13) {
        строка = число.toFixed(13 - строка.indexOf('.') - 1);
        строка = строка.replace(/\.?0+$/, '');
      }
      return строка;
    }
    
    function обновитьЭкран() {
      let отображаемое = текущееЧисло;
      if (отображаемое.length < 13) {
        if (отображаемое.includes('.')) {
          отображаемое = отображаемое.padEnd(13, '0');
        } else {
          отображаемое = отображаемое.padStart(13, ' ');
        }
      }
      экран.textContent = отображаемое;
    }
    
    function вычислитьВыражение(числа, операторы) {
      let результат = [...числа];
      let опы = [...операторы];
      
      for (let i = 0; i < опы.length; i++) {
        if (опы[i] === '*' || опы[i] === '/') {
          let лев = результат[i];
          let прав = результат[i + 1];
          результат.splice(i, 2, опы[i] === '*' ? лев * прав : лев / прав);
          опы.splice(i, 1);
          i--;
        }
      }
      
      for (let i = 0; i < опы.length; i++) {
        let лев = результат[i];
        let прав = результат[i + 1];
        результат.splice(i, 2, опы[i] === '+' ? лев + прав : лев - прав);
        опы.splice(i, 1);
        i--;
      }
      
      return результат[0];
    }
    
    function нажатьКнопку(значение) {
      if (значение === 'C') {
        текущееЧисло = '0';
        выбранныйОператор = null;
        предыдущееЧисло = null;
        сброситьПослеРавно = false;
        выражение = [];
      }
      else if (значение === '+/-') {
        текущееЧисло = String(parseFloat(текущееЧисло) * -1);
      }
      else if (значение === '%') {
        текущееЧисло = String(parseFloat(текущееЧисло) / 100);
      }
      else if (['+', '-', '*', '/'].includes(значение)) {
        выражение.push(parseFloat(текущееЧисло));
        выражение.push(значение);
        предыдущееЧисло = parseFloat(текущееЧисло);
        выбранныйОператор = значение;
        сброситьПослеРавно = true;
      }
      else if (значение === '=') {
        if (выражение.length > 0) {
          выражение.push(parseFloat(текущееЧисло));
          
          let числа = [];
          let операторы = [];
          for (let i = 0; i < выражение.length; i++) {
            if (i % 2 === 0) числа.push(выражение[i]);
            else операторы.push(выражение[i]);
          }
          
          let результат = вычислитьВыражение(числа, операторы);
          текущееЧисло = ограничитьЦифры(результат);
          
          выражение = [];
          выбранныйОператор = null;
          предыдущееЧисло = null;
          сброситьПослеРавно = true;
        }
      }
      else if (значение === '.') {
        if (сброситьПослеРавно) {
          текущееЧисло = '0.';
          сброситьПослеРавно = false;
        }
        else if (!текущееЧисло.includes('.')) {
          текущееЧисло += '.';
        }
      }
      else {
        if (сброситьПослеРавно || текущееЧисло === '0') {
          текущееЧисло = значение;
          сброситьПослеРавно = false;
        }
        else {
          текущееЧисло += значение;
        }
      }
      
      обновитьЭкран();
    }

    window.onload = function() {
      document.getElementById("btn_digit_0").onclick = function() { нажатьКнопку('0'); };
      document.getElementById("btn_digit_1").onclick = function() { нажатьКнопку('1'); };
      document.getElementById("btn_digit_2").onclick = function() { нажатьКнопку('2'); };
      document.getElementById("btn_digit_3").onclick = function() { нажатьКнопку('3'); };
      document.getElementById("btn_digit_4").onclick = function() { нажатьКнопку('4'); };
      document.getElementById("btn_digit_5").onclick = function() { нажатьКнопку('5'); };
      document.getElementById("btn_digit_6").onclick = function() { нажатьКнопку('6'); };
      document.getElementById("btn_digit_7").onclick = function() { нажатьКнопку('7'); };
      document.getElementById("btn_digit_8").onclick = function() { нажатьКнопку('8'); };
      document.getElementById("btn_digit_9").onclick = function() { нажатьКнопку('9'); };
      document.getElementById("btn_digit_dot").onclick = function() { нажатьКнопку('.'); };

      document.getElementById("btn_op_plus").onclick = function() { нажатьКнопку('+'); };
      document.getElementById("btn_op_minus").onclick = function() { нажатьКнопку('-'); };
      document.getElementById("btn_op_mult").onclick = function() { нажатьКнопку('*'); };
      document.getElementById("btn_op_div").onclick = function() { нажатьКнопку('/'); };

      document.getElementById("btn_op_clear").onclick = function() { нажатьКнопку('C'); };
      document.getElementById("btn_op_sign").onclick = function() { нажатьКнопку('+/-'); };
      document.getElementById("btn_op_percent").onclick = function() { нажатьКнопку('%'); };
      document.getElementById("btn_op_equal").onclick = function() { нажатьКнопку('='); };
    };
  </script>
